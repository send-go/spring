name: Publish to Maven Central

# vX.Y.Z 태그 push 또는 수동 실행 시 Maven Central(Sonatype Central Portal)로 배포합니다.
# 필요 시크릿: CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD (Central Portal 토큰),
#              GPG_PRIVATE_KEY, GPG_PASSPHRASE (아티팩트 서명).
# 사전 조건: Sonatype Central 에 `io.sendgo` 네임스페이스 등록/검증(DNS TXT) 완료.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Central 배포
        run: mvn -B -P release deploy -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
